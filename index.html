<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Agent Cost</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Usage</h1>
        <p class="muted" id="meta">Scanning transcripts…</p>
      </div>
      <div class="controls">
        <div class="segmented" id="provider">
          <button data-value="all" aria-pressed="true">All</button>
          <button data-value="claude">Claude</button>
          <button data-value="codex">Codex</button>
        </div>
        <div class="segmented" id="period">
          <button data-value="7">7D</button>
          <button data-value="30" aria-pressed="true">30D</button>
          <button data-value="90">90D</button>
          <button data-value="all">All</button>
        </div>
        <div class="segmented" id="metric">
          <button data-value="cost" aria-pressed="true">Cost</button>
          <button data-value="tokens">Tokens</button>
        </div>
        <label class="select" title="Where Claude requests are priced">
          <span>Price as</span>
          <select id="profile">
            <option value="anthropic">Anthropic API</option>
            <option value="bedrock-global">Bedrock global</option>
            <option value="bedrock-eu">Bedrock EU</option>
            <option value="bedrock-us">Bedrock US</option>
          </select>
        </label>
        <button class="icon" id="refresh" title="Rescan transcripts">↻</button>
      </div>
    </header>

    <section class="tiles" id="tiles"></section>
    <section class="tiles tiles-extra" id="tiles-extra"></section>

    <form class="card plans" id="plans" hidden>
      <h2>Subscription plans</h2>
      <label>Claude Code plan <input type="number" id="plan-claude" min="0" step="any" placeholder="$ / month" /></label>
      <label>Codex / ChatGPT plan <input type="number" id="plan-codex" min="0" step="any" placeholder="$ / month" /></label>
      <button type="submit">Save</button>
      <button type="button" id="plans-clear">Clear</button>
      <span class="muted">Stored on this machine only. Plan cost is prorated by days in the period.</span>
    </form>

    <section class="card">
      <div class="card-head">
        <div class="head-left">
          <h2 id="chart-title">Daily cost by model</h2>
          <div class="segmented" id="resolution">
            <button data-value="day" aria-pressed="true">Day</button>
            <button data-value="hour">Hour</button>
          </div>
        </div>
        <div class="legend" id="chart-legend"></div>
      </div>
      <div class="chart">
        <div class="y-axis" id="y-axis"></div>
        <div class="plot" id="plot">
          <svg id="chart-svg" role="img"></svg>
          <div class="crosshair" id="crosshair" hidden></div>
          <div class="tooltip" id="tooltip" hidden></div>
        </div>
      </div>
      <div class="x-axis" id="x-axis"></div>
    </section>

    <section class="shares">
      <div class="card" id="share-provider"></div>
      <div class="card" id="share-cost"></div>
      <div class="card" id="share-tokens"></div>
    </section>

    <section class="card">
      <h2>Models</h2>
      <table id="models"></table>
    </section>

    <section class="card">
      <h2>Projects</h2>
      <table id="projects"></table>
    </section>

    <section class="card">
      <h2>Top sessions</h2>
      <table id="sessions"></table>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>When you work</h2>
        <span class="muted" id="hours-sub"></span>
      </div>
      <div class="heatmap hours" id="hours-heatmap"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Monthly</h2>
        <span class="muted" id="months-sub"></span>
      </div>
      <div class="months" id="months"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Last 365 days</h2>
        <span class="muted" id="calendar-sub"></span>
      </div>
      <div class="calendar-scroll"><div class="heatmap calendar" id="calendar"></div></div>
    </section>

    <p class="muted footnote">
      API-equivalent cost at LiteLLM list prices. Subscription plans bill separately.
    </p>
    <script src="chart.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
