<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Claude Cost</title>
    <style>
      body { font: 14px system-ui; margin: 0; padding: 20px; background: #111; color: #eee; }
      h1 { font-size: 13px; font-weight: 500; color: #999; margin: 0; }
      #total { font-size: 40px; font-weight: 700; margin: 4px 0 2px; }
      .meta { color: #777; font-size: 12px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #888; margin: 22px 0 6px; }
      table { width: 100%; border-collapse: collapse; }
      td { padding: 4px 0; border-bottom: 1px solid #222; }
      td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
      button { margin-top: 16px; background: #333; color: #eee; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
      .error { color: #f77; }
    </style>
  </head>
  <body>
    <h1>Claude Code · API-equivalent cost</h1>
    <div id="total">…</div>
    <div class="meta" id="meta">Scanning transcripts…</div>
    <h2>Recent active days</h2>
    <table id="days"></table>
    <h2>By model</h2>
    <table id="models"></table>
    <button id="refresh">Refresh</button>
    <script src="renderer.js"></script>
  </body>
</html>
